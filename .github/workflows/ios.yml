
name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build web (Angular + PWA)
        run: npm run build

      - name: Générer le projet iOS
        run: |
          npx cap add ios
          npx capacitor-assets generate --ios
          npx cap sync ios

      - name: Ajouter les permissions (Info.plist)
        run: |
          PLIST=ios/App/App/Info.plist

          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string Votre position sert à calculer un itinéraire et à trouver les arrêts proches. Elle reste sur votre appareil." "$PLIST" || true

          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string comgooglemaps" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string waze" "$PLIST" || true

          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST"

      - name: Compiler l'app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Vérifier les icônes compilées
        run: |
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIcons" \
            ios/build/Build/Products/Release-iphoneos/App.app/Info.plist

      - name: Empaqueter le .ipa
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R App.app Payload/
          zip -r YceoPOC-unsigned.ipa Payload >/dev/null

      - name: Publier le .ipa
        uses: actions/upload-artifact@v4
        with:
          name: YceoPOC-unsigned-ipa
          path: ios/build/Build/Products/Release-iphoneos/YceoPOC-unsigned.ipa
          if-no-files-found: error
